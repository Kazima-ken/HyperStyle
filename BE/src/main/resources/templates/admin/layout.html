<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin | HyperStyle</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .admin {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #111827;
            color: #fff;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            text-align: center;
        }

        .menu a {
            display: block;
            padding: 12px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .menu a:hover,
        .menu a.active {
            background: #1f2933;
            color: #fff;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }

        .btn-add { background: #16a34a; color: #fff; }
        .btn-edit { background: #2563eb; color: #fff; }
        .btn-del { background: #dc2626; color: #fff; }
    </style>
</head>

<body>
<div class="admin">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>HYPERSTYLE</h2>
        <div class="menu">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Sản phẩm</a>
            <a href="/admin/orders">Hóa đơn</a>
            <a href="/admin/customers">Khách hàng</a>
            <a href="/admin/employees">Nhân viên</a>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content" th:insert="~{::body}"></div>

</div>
</body>
</html>
