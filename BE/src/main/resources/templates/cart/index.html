<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng | HyperStyle</title>

    <style>
        *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
        html,body{height:100%}
        body{
            margin:0;
            display:flex;
            flex-direction:column;
            background:#f5f5f5;
            color:#222;
        }

        a {
        text-decoration: none;
        color: inherit;
        }

        /* HEADER */
        .header{background:#000;color:#fff}
        .header-inner{
            max-width:1200px;
            margin:auto;
            padding:14px 20px;
            display:flex;
            align-items:center;
            gap:20px;
        }
        .logo a{color:#fff;font-size:22px;font-weight:bold        }
        .search{flex:1}
        .search input{width:100%;padding:10px;border:none;border-radius:4px}
        .cart-link{color:#fff}


        /* MAIN */
        main{flex:1}
        .container{
            max-width:1200px;
            margin:24px auto;
            background:#fff;
            padding:30px;
        }

        table{width:100%;border-collapse:collapse}
        th,td{padding:14px;border-bottom:1px solid #e0e0e0;text-align:center}
        .product{display:flex;gap:14px;align-items:center;text-align:left}
        .product img{width:80px;height:80px;object-fit:contain;border:1px solid #ddd}
        .price{color:#e11d48;font-weight:bold}
        .remove{color:red;font-size:18px;text-decoration:none}

        /* FOOTER */
        .footer{background:#111;color:#ccc}
        .footer-inner{
            max-width:1200px;
            margin:auto;
            padding:30px 20px;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:30px;
        }
        .footer h4{color:#fff;margin-bottom:10px}
        .footer a{display:block;color:#ccc;font-size:14px;margin-bottom:6px}
    </style>
</head>

<body>

<div class="header">
    <div class="header-inner">
        <div class="logo"><a href="/shop">HyperStyle</a></div>
        <div class="search"><input placeholder="Tìm kiếm..."></div>
        <a href="/cart" class="cart-link">🛒 Giỏ hàng</a>
    </div>
</div>

<main>
    <div class="container">
        <h2>Giỏ hàng</h2>

        <table>
            <tr>
                <th>Sản phẩm</th>
                <th>Giá</th>
                <th>SL</th>
                <th></th>
            </tr>

            <tr th:each="item : ${cart}">
                <td>
                    <div class="product">
                        <img th:src="${item.imageUrl}">
                        <div>
                            <strong th:text="${item.name}"></strong><br>
                            <small th:text="'Màu ' + ${item.color} + ' | Size ' + ${item.size}"></small>
                        </div>
                    </div>
                </td>
                <td class="price" th:text="${item.price} + ' đ'"></td>
                <td th:text="${item.quantity}"></td>
                <td>
                    <a th:href="@{/cart/remove(productDetailId=${item.productDetailId})}" class="remove">✕</a>
                </td>
            </tr>
        </table>
    </div>
</main>

<div class="footer">
    <div class="footer-inner">
        <div>
            <h4>HyperStyle</h4>
            <a>Giới thiệu</a>
            <a>Tuyển dụng</a>
        </div>
        <div>
            <h4>Hỗ trợ</h4>
            <a>Đổi trả</a>
            <a>Bảo hành</a>
        </div>
        <div>
            <h4>Thanh toán</h4>
            <a>COD</a>
            <a>Chuyển khoản</a>
        </div>
        <div>
            <h4>Liên hệ</h4>
            <a>Hotline: 1900 xxxx</a>
            <a>Email: support@hyperstyle.vn</a>
        </div>
    </div>
</div>

</body>
</html>
